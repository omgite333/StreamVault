services:
  backend:
    build:
      context: ./backend
    container_name: streamvault-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: streamvault-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
