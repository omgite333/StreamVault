services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: streamvault-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production

    expose:
      - "5000"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - streamvault-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: streamvault-frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    expose:
      - "80"

    networks:
      - streamvault-network

  nginx:
    image: nginx:alpine

    container_name: streamvault-nginx

    restart: unless-stopped

    depends_on:
      - frontend
      - backend

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - streamvault-network

networks:
  streamvault-network:
    driver: bridge